version: '3.9'

services:

  # ── MySQL ─────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: fraud-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: frauddb
      MYSQL_USER: frauduser
      MYSQL_PASSWORD: fraudpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB ───────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: fraud-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ML Service (Python Flask) ─────────────────────────────
  ml-service:
    build:
      context: ./backend/ml-model
      dockerfile: Dockerfile
    container_name: fraud-ml
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      FLASK_DEBUG: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Spring Boot Backend ───────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fraud-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: mysql
      MYSQL_DB: frauddb
      MYSQL_USER: frauduser
      MYSQL_PASSWORD: fraudpassword
      MONGO_HOST: mongodb
      MONGO_DB: frauddb
      ML_SERVICE_URL: http://ml-service:5001
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ── React Frontend ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fraud-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
  mongo_data:
